asyncapi: 3.0.0
info: {title: Noosfera Event Circuits, version: 0.3.0}
servers:
  local:
    host: nats:4222
    protocol: nats
channels:
  intentContract:
    address: intent.contract.v1
    messages: {intentContract: {$ref: "#/components/messages/IntentContract"}}
  evidenceBundle:
    address: evidence.bundle.v1
    messages: {evidenceBundle: {$ref: "#/components/messages/EvidenceBundle"}}
  capability:
    address: authorization.capability.v1
    messages: {capability: {$ref: "#/components/messages/Capability"}}
  cognitiveCycle:
    address: cognition.cycle.v1
    messages: {cognitiveCycle: {$ref: "#/components/messages/CognitiveCycle"}}
  planAttestation:
    address: agency.plan-attestation.v1
    messages: {planAttestation: {$ref: "#/components/messages/PlanAttestation"}}
  approval:
    address: identity.approval.v1
    messages: {approval: {$ref: "#/components/messages/Approval"}}
  revocation:
    address: authorization.revocation.v1
    messages: {revocation: {$ref: "#/components/messages/Revocation"}}
  auditAnchor:
    address: audit.anchor.v1
    messages: {auditAnchor: {$ref: "#/components/messages/AuditAnchor"}}
  actionCommand:
    address: action.command.v1
    messages: {actionCommand: {$ref: "#/components/messages/ActionCommand"}}
  stop:
    address: safety.stop.v1
    messages: {stop: {$ref: "#/components/messages/Stop"}}
  audit:
    address: audit.event.v1
    messages: {audit: {$ref: "#/components/messages/AuditEvent"}}
  missionEvent:
    address: mission.event.v1
    messages: {missionEvent: {$ref: "#/components/messages/MissionEvent"}}
operations:
  publishIntent: {action: send, channel: {$ref: "#/channels/intentContract"}}
  publishEvidence: {action: send, channel: {$ref: "#/channels/evidenceBundle"}}
  publishCapability: {action: send, channel: {$ref: "#/channels/capability"}}
  publishCognitiveCycle: {action: send, channel: {$ref: "#/channels/cognitiveCycle"}}
  attestPlan: {action: send, channel: {$ref: "#/channels/planAttestation"}}
  publishApproval: {action: send, channel: {$ref: "#/channels/approval"}}
  revokeCapability: {action: send, channel: {$ref: "#/channels/revocation"}}
  publishAuditAnchor: {action: send, channel: {$ref: "#/channels/auditAnchor"}}
  executeCommand: {action: send, channel: {$ref: "#/channels/actionCommand"}}
  requestStop: {action: send, channel: {$ref: "#/channels/stop"}}
  appendAudit: {action: send, channel: {$ref: "#/channels/audit"}}
  publishMissionEvent: {action: send, channel: {$ref: "#/channels/missionEvent"}}
components:
  messages:
    IntentContract: {payload: {$ref: ../schemas/intent-contract.schema.json}}
    EvidenceBundle: {payload: {$ref: ../schemas/evidence-bundle.schema.json}}
    Capability: {payload: {$ref: ../schemas/capability.schema.json}}
    CognitiveCycle: {payload: {$ref: ../schemas/cognitive-cycle.schema.json}}
    PlanAttestation: {payload: {$ref: ../schemas/plan-attestation.schema.json}}
    Approval: {payload: {$ref: ../schemas/approval-receipt.schema.json}}
    Revocation: {payload: {$ref: ../schemas/revocation-directive.schema.json}}
    AuditAnchor: {payload: {$ref: ../schemas/audit-anchor.schema.json}}
    AuditEvent: {payload: {$ref: ../schemas/audit-event.schema.json}}
    MissionEvent: {payload: {$ref: ../schemas/mission-event.schema.json}}
    ActionCommand:
      payload:
        type: object
        additionalProperties: false
        required: [execution_id, actuator, operation, parameters_hash]
        properties:
          execution_id: {type: string}
          actuator: {type: string}
          operation: {type: string}
          parameters_hash: {type: string}
    Stop:
      payload:
        type: object
        additionalProperties: false
        required: [execution_id, reason, safe_state]
        properties:
          execution_id: {type: string}
          reason: {type: string}
          safe_state: {type: string}
