apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata: {name: noosfera-signed-images}
spec:
  images: [{glob: "ghcr.io/sheilyneural-afk/**"}]
  authorities:
    - keyless:
        identities:
          - issuer: https://token.actions.githubusercontent.com
            subjectRegExp: "^https://github.com/sheilyneural-afk/Sheily/.*$"
      attestations:
        - name: provenance
          predicateType: slsaprovenance
          policy: {type: cue, data: "predicateType: string"}
