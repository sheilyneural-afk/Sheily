name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  architecture-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e '.[dev]'
      - run: python tools/verify_repository.py
      - run: python tools/validate_schemas.py
      - run: pytest -q
      - run: ruff check packages/python services tests tools

  rust-kernels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with: {components: rustfmt,clippy}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  typescript-consoles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: {node-version: "24", cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  protocols-and-policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      - run: docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.1.0-static test /policies -v
      - run: helm lint deploy/helm/noosfera
