syntax = "proto3";

package noosfera.federation.v1;

import "google/protobuf/timestamp.proto";
import "noosfera/common/v1/common.proto";

message FederationPackage {
  string id = 1;
  string source_node = 2;
  string destination_node = 3;
  string protocol = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  bytes payload_hash = 7;
  string content_type = 8;
  uint32 hop_limit = 9;
  repeated string previous_hops = 10;
  noosfera.common.v1.Signature signature = 11;
}

message DeliveryReceipt {
  string package_id = 1;
  string receiving_node = 2;
  string status = 3;
  google.protobuf.Timestamp received_at = 4;
}

message AcceptRequest {
  FederationPackage package = 1;
}

message AcceptResponse {
  DeliveryReceipt receipt = 1;
}

service FederationService {
  rpc Accept(AcceptRequest) returns (AcceptResponse);
}
