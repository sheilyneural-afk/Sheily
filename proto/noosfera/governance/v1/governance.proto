syntax = "proto3";

package noosfera.governance.v1;

import "google/protobuf/timestamp.proto";

message PolicyDecision {
  string id = 1;
  string policy_id = 2;
  string policy_version = 3;
  bool allow = 4;
  repeated string reasons = 5;
  repeated string obligations = 6;
  bytes input_hash = 7;
  google.protobuf.Timestamp decided_at = 8;
}

message EvaluateRequest {
  string policy_id = 1;
  bytes canonical_input = 2;
}

message EvaluateResponse {
  PolicyDecision decision = 1;
}

message SignedDirective {
  string id = 1;
  string directive_type = 2;
  string subject = 3;
  string reason = 4;
  int64 version = 5;
  string issued_by = 6;
  google.protobuf.Timestamp issued_at = 7;
  string key_id = 8;
  string algorithm = 9;
  bytes signature = 10;
}

service GovernanceService {
  rpc Evaluate(EvaluateRequest) returns (EvaluateResponse);
}
