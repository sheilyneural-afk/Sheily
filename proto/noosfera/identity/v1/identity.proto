syntax = "proto3";

package noosfera.identity.v1;

import "google/protobuf/timestamp.proto";

message ContinuityEvent {
  string id = 1;
  string event_type = 2;
  repeated string predecessors = 3;
  repeated string successors = 4;
  google.protobuf.Timestamp occurred_at = 5;
  repeated string evidence = 6;
  string status = 7;
}

message VerifyRequest {
  string identity = 1;
  bytes proof = 2;
  string purpose = 3;
}

message VerifyResponse {
  bool verified = 1;
  string assurance_level = 2;
  repeated string limitations = 3;
}

message RecordContinuityRequest {
  ContinuityEvent event = 1;
}

message RecordContinuityResponse {
  ContinuityEvent event = 1;
}

message ApprovalReceipt {
  string id = 1;
  string user_id = 2;
  string mission_id = 3;
  bytes plan_hash = 4;
  bool approved = 5;
  bool remember_result = 6;
  string reason = 7;
  google.protobuf.Timestamp issued_at = 8;
  google.protobuf.Timestamp expiry = 9;
  string key_id = 10;
  string algorithm = 11;
  bytes signature = 12;
}

service IdentityService {
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  rpc RecordContinuity(RecordContinuityRequest) returns (RecordContinuityResponse);
}
