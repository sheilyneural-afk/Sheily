receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  memory_limiter: {check_interval: 1s, limit_mib: 512}
  batch: {timeout: 1s}
  attributes/privacy:
    actions:
      - {key: noosfera.payload, action: delete}
      - {key: noosfera.memory_content, action: delete}
      - {key: noosfera.neural_signal, action: delete}
  resource:
    attributes:
      - {key: service.namespace, value: noosfera, action: upsert}

exporters:
  prometheus: {endpoint: 0.0.0.0:8889}
  otlp/tempo: {endpoint: tempo:4317, tls: {insecure: true}}
  otlphttp/loki: {endpoint: http://loki:3100/otlp}
  debug: {verbosity: basic}

service:
  telemetry: {logs: {level: info}}
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, resource, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, resource, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, resource, batch]
      exporters: [otlphttp/loki]
