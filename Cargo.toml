[workspace]
resolver = "2"
members = [
  "packages/rust/noosfera-capability",
  "packages/rust/noosfera-execution-kernel",
  "packages/rust/noosfera-execution-service",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license-file = "LICENSE.md"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tokio-postgres = { version = "0.7", features = ["with-time-0_3"] }
uuid = { version = "1", features = ["serde", "v4"] }
