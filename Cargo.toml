[workspace]
resolver = "2"
members = [
  "packages/rust/noosfera-capability",
  "packages/rust/noosfera-execution-kernel",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE.md"

[workspace.dependencies]
anyhow = "1"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
