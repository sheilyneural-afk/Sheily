apiVersion: v1
kind: Secret
metadata:
  name: noosfera-signing-refs
type: Opaque
stringData:
  database-url: postgresql://replace-with-managed-identity-or-secret
  internal-service-token: replace-with-random-service-token
  local-password: replace-with-identity-password
  identity-private-key-b64: replace-with-base64-ed25519-seed
  agency-private-key-b64: replace-with-base64-ed25519-seed
  governance-private-key-b64: replace-with-base64-ed25519-seed
  audit-private-key-b64: replace-with-base64-ed25519-seed
  experience-service: vault://transit/experience
  identity-service: vault://transit/identity
  memory-service: vault://transit/memory
  perception-service: vault://transit/perception
  cognition-service: vault://transit/cognition
  agency-service: vault://transit/agency
  governance-service: vault://transit/governance-capability
  execution-service: vault://transit/execution-attestation
  federation-service: vault://transit/federation
  security-service: vault://transit/security
  audit-service: vault://transit/audit-receipt
  evolution-service: vault://transit/evolution
  temporal-service: vault://transit/temporal
  resource-service: vault://transit/resource
