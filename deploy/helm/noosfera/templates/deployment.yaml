{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    noosfera.io/family: {{ .family }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .name }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        noosfera.io/family: {{ .family }}
    spec:
      serviceAccountName: {{ .name }}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: service
          image: "{{ $.Values.global.imageRegistry }}/{{ .name }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: noosfera-global}}]
          env:
            - name: NOOSFERA_SIGNING_KEY_REF
              valueFrom: {secretKeyRef: {name: noosfera-signing-refs, key: {{ .name }}}}
          resources: {{ toYaml $.Values.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 30
{{- end }}
