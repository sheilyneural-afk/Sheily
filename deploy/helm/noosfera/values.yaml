global:
  imageRegistry: ghcr.io/sheilyneural-afk
  imageTag: "0.3.0"
  nodeId: node-unconfigured
  environment: production
  otlpEndpoint: http://otel-collector:4317
  opaUrl: http://opa:8181
  natsUrl: nats://nats:4222
  identityUrl: http://identity-service:8102
  cognitionUrl: http://cognition-service:8105
  agencyUrl: http://agency-service:8106
  governanceUrl: http://governance-service:8107
  executionUrl: http://execution-service:8108
  modelBaseUrl: http://ollama:11434
  modelName: qwen3:8b
  identityKeyId: identity-production-v1
  identityPublicKeyB64: replace-with-identity-public-key
  agencyKeyId: agency-production-v1
  agencyPublicKeyB64: replace-with-agency-public-key
  governanceKeyId: governance-production-v1
  governancePublicKeyB64: replace-with-governance-public-key
  auditKeyId: audit-production-v1
  auditPublicKeyB64: replace-with-audit-public-key

services:
  - {name: experience-service, port: 8101, replicas: 2, family: EXP}
  - {name: identity-service, port: 8102, replicas: 3, family: IDN}
  - {name: memory-service, port: 8103, replicas: 3, family: MEM}
  - {name: perception-service, port: 8104, replicas: 3, family: PER}
  - {name: cognition-service, port: 8105, replicas: 2, family: COG}
  - {name: agency-service, port: 8106, replicas: 3, family: AGY}
  - {name: governance-service, port: 8107, replicas: 5, family: GOV}
  - {name: execution-service, port: 8108, replicas: 3, family: EXE}
  - {name: federation-service, port: 8109, replicas: 3, family: FED}
  - {name: security-service, port: 8110, replicas: 3, family: SEC}
  - {name: audit-service, port: 8111, replicas: 3, family: AUD}
  - {name: evolution-service, port: 8112, replicas: 2, family: EVO}
  - {name: temporal-service, port: 8113, replicas: 3, family: TMP}
  - {name: resource-service, port: 8114, replicas: 3, family: RES}

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 1Gi}
