name: noosfera-local

x-noosfera-service: &noosfera-service
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    nats: {condition: service_started}
    opa: {condition: service_started}
  networks: [control, data]
  environment: &noosfera-environment
    NOOSFERA_ENV: ${NOOSFERA_ENV:-local}
    NOOSFERA_NODE_ID: ${NOOSFERA_NODE_ID:-node-local-development}
    NOOSFERA_LOG_LEVEL: ${NOOSFERA_LOG_LEVEL:-INFO}
    NOOSFERA_DATABASE_URL: postgresql://noosfera:noosfera@postgres:5432/noosfera
    NOOSFERA_NATS_URL: nats://nats:4222
    NOOSFERA_OBJECT_STORE_ENDPOINT: http://minio:9000
    NOOSFERA_OBJECT_STORE_BUCKET: ${NOOSFERA_OBJECT_STORE_BUCKET:-noosfera-evidence}
    NOOSFERA_OPA_URL: http://opa:8181
    NOOSFERA_OTLP_ENDPOINT: http://otel-collector:4317
    NOOSFERA_SIGNING_KEY_REF: ${NOOSFERA_SIGNING_KEY_REF:-local-development-only}
    NOOSFERA_EXECUTION_URL: http://execution-service:8080
    NOOSFERA_IDENTITY_URL: http://identity-service:8080
    NOOSFERA_COGNITION_URL: http://cognition-service:8080
    NOOSFERA_AGENCY_URL: http://agency-service:8080
    NOOSFERA_GOVERNANCE_URL: http://governance-service:8080
    NOOSFERA_AUDIT_URL: http://audit-service:8080
    NOOSFERA_DOCUMENT_VERIFICATION_BACKEND: remote
    NOOSFERA_IDENTITY_BACKEND: remote
    NOOSFERA_COGNITION_BACKEND: remote
    NOOSFERA_AGENCY_BACKEND: remote
    NOOSFERA_GOVERNANCE_BACKEND: remote
    NOOSFERA_MODEL_BASE_URL: http://ollama:11434
    NOOSFERA_MODEL_PROVIDER: ${NOOSFERA_MODEL_PROVIDER:-ollama}
    NOOSFERA_MODEL_NAME: ${NOOSFERA_MODEL_NAME:-qwen3:8b}
    NOOSFERA_MODEL_ALLOW_REMOTE: ${NOOSFERA_MODEL_ALLOW_REMOTE:-false}
    NOOSFERA_MODEL_TIMEOUT_SECONDS: ${NOOSFERA_MODEL_TIMEOUT_SECONDS:-600}
    NOOSFERA_MODEL_MAX_CONCURRENCY: ${NOOSFERA_MODEL_MAX_CONCURRENCY:-1}
    NOOSFERA_MODEL_MAX_INPUT_CHARS: ${NOOSFERA_MODEL_MAX_INPUT_CHARS:-200000}
    NOOSFERA_MODEL_DOCUMENT_MAX_BLOCKS: ${NOOSFERA_MODEL_DOCUMENT_MAX_BLOCKS:-32}
    NOOSFERA_MODEL_CONTEXT_TOKENS: ${NOOSFERA_MODEL_CONTEXT_TOKENS:-32768}
    NOOSFERA_MODEL_OUTPUT_TOKENS: ${NOOSFERA_MODEL_OUTPUT_TOKENS:-4096}
    NOOSFERA_SELF_MODEL_REGISTRY_PATH: /app/registry
    NOOSFERA_RUNTIME_REGISTRY_URLS: experience-service=http://experience-service:8080,identity-service=http://identity-service:8080,memory-service=http://memory-service:8080,perception-service=http://perception-service:8080,cognition-service=http://cognition-service:8080,agency-service=http://agency-service:8080,governance-service=http://governance-service:8080,execution-service=http://execution-service:8080,federation-service=http://federation-service:8080,security-service=http://security-service:8080,audit-service=http://audit-service:8080,evolution-service=http://evolution-service:8080,temporal-service=http://temporal-service:8080,resource-service=http://resource-service:8080
    NOOSFERA_MAX_DOCUMENT_BYTES: ${NOOSFERA_MAX_DOCUMENT_BYTES:-5000000}
    NOOSFERA_MAX_OUTPUT_BYTES: ${NOOSFERA_MAX_OUTPUT_BYTES:-250000}
    NOOSFERA_LOCAL_USERNAME: ${NOOSFERA_LOCAL_USERNAME:-sheily}
    NOOSFERA_LOCAL_PASSWORD: ${NOOSFERA_LOCAL_PASSWORD:-sheily}
    NOOSFERA_INTERNAL_SERVICE_TOKEN: ${NOOSFERA_INTERNAL_SERVICE_TOKEN:-local-internal-service-token-change-me}
    NOOSFERA_IDENTITY_KEY_ID: ${NOOSFERA_IDENTITY_KEY_ID:-identity-local-v1}
    NOOSFERA_IDENTITY_PUBLIC_KEY_B64: ${NOOSFERA_IDENTITY_PUBLIC_KEY_B64:-exnDIf2q8iXSzoTw0cuNx3YEmeVS7DNcVIIB7pPPcHg=}
    NOOSFERA_AGENCY_KEY_ID: ${NOOSFERA_AGENCY_KEY_ID:-agency-local-v1}
    NOOSFERA_AGENCY_PUBLIC_KEY_B64: ${NOOSFERA_AGENCY_PUBLIC_KEY_B64:-QGNyLWPX7BkNlh+cnFMvTRdT4MixG5cPhcRuBD0DUq0=}
    NOOSFERA_GOVERNANCE_KEY_ID: ${NOOSFERA_GOVERNANCE_KEY_ID:-governance-local-v1}
    NOOSFERA_GOVERNANCE_PUBLIC_KEY_B64: ${NOOSFERA_GOVERNANCE_PUBLIC_KEY_B64:-IrJbc2jDxJLC4UnngrXD4MAMz1PCOkfvSPAu064Vg3c=}
    NOOSFERA_AUDIT_KEY_ID: ${NOOSFERA_AUDIT_KEY_ID:-audit-local-v1}
    NOOSFERA_AUDIT_PUBLIC_KEY_B64: ${NOOSFERA_AUDIT_PUBLIC_KEY_B64:-TdIFu4tTVfVgNGcq5iU5XdNNOI+CZyeHNlQkUyviV2g=}
    NOOSFERA_TOKEN_TTL_SECONDS: ${NOOSFERA_TOKEN_TTL_SECONDS:-3600}
    NOOSFERA_CORS_ORIGINS: ${NOOSFERA_CORS_ORIGINS:-http://localhost:3001,http://localhost:3002}
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: noosfera
      POSTGRES_USER: noosfera
      POSTGRES_PASSWORD: noosfera
    healthcheck: {test: [CMD-SHELL, "pg_isready -U noosfera"], interval: 5s, timeout: 3s, retries: 20}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../database/migrations:/docker-entrypoint-initdb.d:ro
    networks: [data]

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir", "/data"]
    volumes: [nats-data:/data]
    ports: ["4222:4222", "8222:8222"]
    networks: [control, data, audit]

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: noosfera, MINIO_ROOT_PASSWORD: noosfera-local-only}
    volumes: [object-data:/data]
    ports: ["9000:9000", "9001:9001"]
    networks: [data]

  opa:
    image: openpolicyagent/opa:1.1.0-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes: ["../../policies:/policies:ro"]
    ports: ["8181:8181"]
    networks: [control]
    read_only: true

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["../../observability/otel/collector.yaml:/etc/otel/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318", "8889:8889"]
    networks: [control, audit]

  ollama:
    image: ollama/ollama:latest
    container_name: sheily-ollama
    volumes: [ollama-data:/root/.ollama]
    ports: ["${NOOSFERA_OLLAMA_PORT:-11434}:11434"]
    networks: [model]
    restart: unless-stopped

  experience-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: experience-service}}
    ports: ["8101:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_started}
      opa: {condition: service_started}
      identity-service: {condition: service_started}
      cognition-service: {condition: service_started}
      agency-service: {condition: service_started}
      governance-service: {condition: service_started}
      execution-service: {condition: service_started}
    networks: [edge, control, data, model]
  identity-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: identity-service}}
    ports: ["8102:8080"]
    environment:
      <<: *noosfera-environment
      NOOSFERA_IDENTITY_PRIVATE_KEY_B64: ${NOOSFERA_IDENTITY_PRIVATE_KEY_B64:-fECcWuqB0rjSdD2t6ADoVCOkG6Or8bG/mHeytU39bHs=}
  memory-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: memory-service}}
    ports: ["8103:8080"]
  perception-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: perception-service}}
    ports: ["8104:8080"]
  cognition-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: cognition-service}}
    ports: ["8105:8080"]
  agency-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: agency-service}}
    ports: ["8106:8080"]
    environment:
      <<: *noosfera-environment
      NOOSFERA_AGENCY_PRIVATE_KEY_B64: ${NOOSFERA_AGENCY_PRIVATE_KEY_B64:-hM6ZIQvpEOSkYUgaFeJu3u2cNil7rZXxyZsl9a72gqk=}
  governance-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: governance-service}}
    ports: ["8107:8080"]
    environment:
      <<: *noosfera-environment
      NOOSFERA_GOVERNANCE_PRIVATE_KEY_B64: ${NOOSFERA_GOVERNANCE_PRIVATE_KEY_B64:-x3lPBPxt4rySiYr6hfnQpQborcN/7OcjVr+2qEuqiFQ=}
  execution-service:
    build: {context: ../.., dockerfile: deploy/images/execution-service.Containerfile}
    environment:
      NOOSFERA_DATABASE_URL: postgresql://noosfera:noosfera@postgres:5432/noosfera
      NOOSFERA_GOVERNANCE_KEY_ID: ${NOOSFERA_GOVERNANCE_KEY_ID:-governance-local-v1}
      NOOSFERA_GOVERNANCE_PUBLIC_KEY_B64: ${NOOSFERA_GOVERNANCE_PUBLIC_KEY_B64:-IrJbc2jDxJLC4UnngrXD4MAMz1PCOkfvSPAu064Vg3c=}
      NOOSFERA_AUDIT_KEY_ID: ${NOOSFERA_AUDIT_KEY_ID:-audit-local-v1}
      NOOSFERA_AUDIT_PUBLIC_KEY_B64: ${NOOSFERA_AUDIT_PUBLIC_KEY_B64:-TdIFu4tTVfVgNGcq5iU5XdNNOI+CZyeHNlQkUyviV2g=}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [control, data, audit]
    ports: ["8108:8080"]
  federation-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: federation-service}}
    ports: ["8109:8080"]
  security-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: security-service}}
    ports: ["8110:8080"]
  audit-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: audit-service}}
    ports: ["8111:8080"]
    networks: [audit, data]
    environment:
      <<: *noosfera-environment
      NOOSFERA_AUDIT_PRIVATE_KEY_B64: ${NOOSFERA_AUDIT_PRIVATE_KEY_B64:-TT1KteJqMjx2lLLp70hZcnMKz5P0ypFdNfZ91v88S4g=}
  evolution-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: evolution-service}}
    ports: ["8112:8080"]
  temporal-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: temporal-service}}
    ports: ["8113:8080"]
  resource-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: resource-service}}
    ports: ["8114:8080"]

  personal-console:
    build:
      context: ../..
      dockerfile: deploy/images/console.Containerfile
      args: {APP_NAME: personal-console, VITE_SHEILY_API_URL: ""}
    depends_on: [experience-service]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    ports: ["${NOOSFERA_PERSONAL_CONSOLE_PORT:-3001}:8080"]
    networks: [edge]

  operator-console:
    build:
      context: ../..
      dockerfile: deploy/images/console.Containerfile
      args: {APP_NAME: operator-console, VITE_SHEILY_API_URL: ""}
    depends_on: [experience-service]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    ports: ["${NOOSFERA_OPERATOR_CONSOLE_PORT:-3002}:8080"]
    networks: [edge]

networks:
  edge: {}
  control: {internal: true}
  data: {internal: true}
  audit: {internal: true}
  model: {internal: true}

volumes:
  postgres-data: {}
  nats-data: {}
  object-data: {}
  ollama-data: {}
