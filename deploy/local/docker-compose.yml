name: noosfera-local

x-noosfera-service: &noosfera-service
  restart: unless-stopped
  env_file: ../../.env.example
  depends_on:
    postgres: {condition: service_healthy}
    nats: {condition: service_started}
    opa: {condition: service_started}
  networks: [control, data]
  environment:
    NOOSFERA_DATABASE_URL: postgresql://noosfera:noosfera@postgres:5432/noosfera
    NOOSFERA_NATS_URL: nats://nats:4222
    NOOSFERA_OBJECT_STORE_ENDPOINT: http://minio:9000
    NOOSFERA_OPA_URL: http://opa:8181
    NOOSFERA_OTLP_ENDPOINT: http://otel-collector:4317
    NOOSFERA_EXECUTION_URL: http://execution-service:8080
    NOOSFERA_MODEL_BASE_URL: http://ollama:11434
    NOOSFERA_MODEL_PROVIDER: ${NOOSFERA_MODEL_PROVIDER:-ollama}
    NOOSFERA_MODEL_NAME: ${NOOSFERA_MODEL_NAME:-qwen3:8b}
    NOOSFERA_LOCAL_PASSWORD: ${NOOSFERA_LOCAL_PASSWORD:-change-me-local}
    NOOSFERA_TOKEN_SECRET: ${NOOSFERA_TOKEN_SECRET:-local-token-secret-change-me-32-characters}
    NOOSFERA_CAPABILITY_SECRET: ${NOOSFERA_CAPABILITY_SECRET:-local-capability-secret-change-me-32-chars}
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: noosfera
      POSTGRES_USER: noosfera
      POSTGRES_PASSWORD: noosfera
    healthcheck: {test: [CMD-SHELL, "pg_isready -U noosfera"], interval: 5s, timeout: 3s, retries: 20}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../database/migrations:/docker-entrypoint-initdb.d:ro
    networks: [data]

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir", "/data"]
    volumes: [nats-data:/data]
    ports: ["4222:4222", "8222:8222"]
    networks: [control, data, audit]

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: noosfera, MINIO_ROOT_PASSWORD: noosfera-local-only}
    volumes: [object-data:/data]
    ports: ["9000:9000", "9001:9001"]
    networks: [data]

  opa:
    image: openpolicyagent/opa:1.1.0-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes: ["../../policies:/policies:ro"]
    ports: ["8181:8181"]
    networks: [control]
    read_only: true

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["../../observability/otel/collector.yaml:/etc/otel/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318", "8889:8889"]
    networks: [control, audit]

  ollama:
    image: ollama/ollama:latest
    container_name: sheily-ollama
    volumes: [ollama-data:/root/.ollama]
    ports: ["11434:11434"]
    networks: [model]
    restart: unless-stopped

  experience-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: experience-service}}
    ports: ["8101:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_started}
      opa: {condition: service_started}
      execution-service: {condition: service_started}
    networks: [edge, control, data, model]
  identity-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: identity-service}}
    ports: ["8102:8080"]
  memory-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: memory-service}}
    ports: ["8103:8080"]
  perception-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: perception-service}}
    ports: ["8104:8080"]
  cognition-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: cognition-service}}
    ports: ["8105:8080"]
  agency-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: agency-service}}
    ports: ["8106:8080"]
  governance-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: governance-service}}
    ports: ["8107:8080"]
  execution-service:
    build: {context: ../.., dockerfile: deploy/images/execution-service.Containerfile}
    env_file: ../../.env.example
    environment:
      NOOSFERA_CAPABILITY_SECRET: ${NOOSFERA_CAPABILITY_SECRET:-local-capability-secret-change-me-32-chars}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    networks: [control, audit]
    ports: ["8108:8080"]
  federation-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: federation-service}}
    ports: ["8109:8080"]
  security-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: security-service}}
    ports: ["8110:8080"]
  audit-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: audit-service}}
    ports: ["8111:8080"]
    networks: [audit, data]
  evolution-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: evolution-service}}
    ports: ["8112:8080"]
  temporal-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: temporal-service}}
    ports: ["8113:8080"]
  resource-service:
    <<: *noosfera-service
    build: {context: ../.., dockerfile: deploy/images/reference-service.Containerfile, args: {SERVICE_DIR: resource-service}}
    ports: ["8114:8080"]

  personal-console:
    build:
      context: ../..
      dockerfile: deploy/images/console.Containerfile
      args: {APP_NAME: personal-console, VITE_SHEILY_API_URL: http://localhost:8101}
    depends_on: [experience-service]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    ports: ["3001:8080"]
    networks: [edge]

  operator-console:
    build:
      context: ../..
      dockerfile: deploy/images/console.Containerfile
      args: {APP_NAME: operator-console, VITE_SHEILY_API_URL: http://localhost:8101}
    depends_on: [experience-service]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    ports: ["3002:8080"]
    networks: [edge]

networks:
  edge: {}
  control: {internal: true}
  data: {internal: true}
  audit: {internal: true}
  model: {internal: true}

volumes:
  postgres-data: {}
  nats-data: {}
  object-data: {}
  ollama-data: {}
